[project]
name = "uptime-monitor"
version = "1.0.0"
description = "A cloud-native uptime-monitor microservice for a DevOps/SRE/Cloud portfolio."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
